<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>OpenBroadcast — profile / square</title><link rel="stylesheet" href="_base.css">
<style>
  /* Profile picture and square post: the mark alone, legible at 64px. */
  .board { width: 1080px; height: 1080px; align-items: center; justify-content: center; gap: 58px; padding: 90px 90px 130px; }
  .mark { width: 300px; height: 360px; border-radius: 22px; box-shadow: 0 0 140px -30px var(--bar-cyan); }
  .wordmark { font-size: 62px; letter-spacing: 0.2em; text-align: center; }
  .sub { margin-top: 26px; font-size: 26px; letter-spacing: 0.24em; color: var(--faint); text-align: center; }
</style></head><body>
<div class="board scan">
  <span class="mark bars"></span>
  <div>
    <div class="wordmark">Openbroadcast</div>
    <div class="mono sub">Live TV from everywhere</div>
  </div>
</div></body></html>
